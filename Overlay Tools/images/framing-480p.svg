<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="636" viewBox="0 0 1120 636" role="img" aria-labelledby="title desc">
  <title id="title">480p artwork framing: normal and Tate</title>
  <desc id="desc">Both 720 by 480 pixel rasters are shown at their 4 to 3 display aspect. Normal artwork occupies 423 by 480 pixels, with 148 clear pixels on the left and 149 on the right. CW and CCW Tate artwork occupies 690 by 480 pixels, with 15 clear pixels on each side. All dimensions are stored pixel counts.</desc>
  <rect width="1120" height="636" rx="12" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172b42">
    <g font-size="27" font-weight="700">
      <text x="40" y="43">480p / Normal</text>
      <text x="600" y="43">480p / Tate (CW or CCW)</text>
    </g>
    <g font-size="22" fill="#475569">
      <text x="40" y="77">720 &#215; 480 raster</text>
      <text x="600" y="77">720 &#215; 480 raster</text>
    </g>
    <!-- Display aspect 4:3: x scale 480/720, y scale 360/480 (pixel aspect 8:9). -->
    <rect x="40" y="114" width="480" height="360" fill="#e2e8f0"/>
    <rect x="138.666667" y="114" width="282" height="360" fill="#d8effc"/>
    <rect x="40" y="114" width="480" height="360" fill="none" stroke="#475569" stroke-width="1.5"/>
    <path d="M138.666667 114v360 M420.666667 114v360" fill="none" stroke="#2471a3" stroke-width="1.5"/>
    <g text-anchor="middle">
      <text x="279.666667" y="285" font-size="25">Artwork</text>
      <text x="279.666667" y="325" font-size="31" font-weight="700">423 &#215; 480</text>
      <g font-size="20" fill="#475569">
        <text x="89.333333" y="295">148</text>
        <text x="89.333333" y="322">px</text>
        <text x="470.333333" y="295">149</text>
        <text x="470.333333" y="322">px</text>
      </g>
    </g>
    <rect x="600" y="114" width="480" height="360" fill="#e2e8f0"/>
    <rect x="610" y="114" width="460" height="360" fill="#d8effc"/>
    <rect x="600" y="114" width="480" height="360" fill="none" stroke="#475569" stroke-width="1.5"/>
    <path d="M610 114v360 M1070 114v360" fill="none" stroke="#2471a3" stroke-width="1.5"/>
    <g text-anchor="middle">
      <text x="840" y="285" font-size="25">Rotated artwork</text>
      <text x="840" y="325" font-size="31" font-weight="700">690 &#215; 480</text>
    </g>
    <g font-size="21">
      <text x="40" y="510">148 + 423 + 149 = 720 columns</text>
      <text x="600" y="510">15 + 690 + 15 = 720 columns</text>
    </g>
    <g font-size="19" fill="#475569">
      <text x="40" y="539">The extra clear column is on the right.</text>
      <text x="600" y="539">15 px clear padding on each side.</text>
    </g>
    <rect x="40" y="568" width="18" height="18" fill="#d8effc" stroke="#2471a3"/>
    <text x="68" y="583" font-size="18">Artwork region</text>
    <rect x="267" y="568" width="18" height="18" fill="#e2e8f0" stroke="#475569"/>
    <text x="295" y="583" font-size="18">Clear raster padding (alpha 0)</text>
    <text x="40" y="619" font-size="18" fill="#475569">Shown at the 4:3 display aspect; labels count stored pixels. Pixel width:height is 8:9.</text>
  </g>
</svg>
